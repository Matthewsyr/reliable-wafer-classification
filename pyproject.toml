[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waferdefect"
version = "0.1.0"
description = "Reliable wafer classification: generalization, rare classes, and explicit decision trade-offs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2.1,<2.3", "pandas>=2.2,<2.4", "scikit-learn>=1.6,<1.8", "joblib>=1.4,<1.7"]

[project.optional-dependencies]
cnn = ["torch>=2.6,<2.8"]
test = ["pytest>=8,<9"]

[project.scripts]
waferdefect = "waferdefect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
waferdefect = ["provenance.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

