name: package-tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt -e ".[test]"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_provenance.py
      - run: python scripts/recompute_decisions.py
      - run: python scripts/check_publish.py
